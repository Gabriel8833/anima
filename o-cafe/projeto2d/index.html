<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Café com Leite 2D</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style>
</head><body>
<script type="module">
import { createStudio, runEpisode } from './motor/estudio.js';
const q = new URLSearchParams(location.search);
const ep = (await import(`./episodios/${q.get('ep') || 'ep01'}/episodio.js`)).default;
await document.fonts.load('900 80px Inter');
const st = createStudio({ scale: parseFloat(q.get('scale') || '1') });
runEpisode(st, ep, { legendas: q.get('legendas') !== '0' });
window.duracao = ep.duracao;
// Assistir ao vivo no navegador: index.html?play=1
if (q.get('play')) { const t0 = performance.now(); const loop = () => { window.renderFrame(((performance.now() - t0) / 1000) % ep.duracao); requestAnimationFrame(loop); }; loop(); }
</script></body></html>
