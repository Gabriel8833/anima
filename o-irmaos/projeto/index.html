<script type="module">
import { createStudio, runEpisode } from './motor/estudio.js';
const q = new URLSearchParams(location.search);
const ep = (await import(`./episodios/${q.get('ep') || 'ep01'}/episodio.js`)).default;
const st = createStudio({ scale: parseFloat(q.get('scale') || '1') }); st.legendas = q.get('legendas') === '1';
runEpisode(st, ep);
window.duracao = ep.duracao;
// Visualização ao vivo no navegador: ?play=1
if (q.get('play')) { const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % ep.duracao; window.renderFrame(t); requestAnimationFrame(loop); }; loop(); }
</script></body></html>
